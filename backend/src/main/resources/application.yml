spring:
  application:
    name: petshop-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petshop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:petshop}
    password: ${DB_PASSWORD:petshop_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 9090
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: Petshop Backend
    version: 1.0.0
