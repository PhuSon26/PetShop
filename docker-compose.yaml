services:
  mysql:
    image: mysql:8.0
    container_name: petshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: petshop
      MYSQL_USER: petshop
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - petshop-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: petshop-backend:1.0
    container_name: petshop-backend
    ports:
      - "9090:9090"
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/petshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: petshop
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - petshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: petshop-frontend:1.0
    container_name: petshop-frontend
    ports:
      - "5175:5175"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - petshop-network

volumes:
  mysql_data:

networks:
  petshop-network:
    driver: bridge