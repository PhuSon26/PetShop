- name: Docker build and push PetShop
  hosts: local
  become: yes

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Build Backend Docker Image
      command: docker build -t petshop-backend:1.0 .
      args:
        chdir: /var/lib/jenkins/workspace/petshop-ci/backend

    - name: Tag Backend Image
      command: docker tag petshop-backend:1.0 phuson0206/petshop-backend:1.0

    - name: Build Frontend Docker Image
      command: docker build -t petshop-frontend:1.0 .
      args:
        chdir: /var/lib/jenkins/workspace/petshop-ci/frontend

    - name: Tag Frontend Image
      command: docker tag petshop-frontend:1.0 phuson0206/petshop-frontend:1.0

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: phuson0206
        password: "{{ dockerhub_password }}"

    - name: Push Backend Image
      command: docker push phuson0206/petshop-backend:1.0

    - name: Push Frontend Image
      command: docker push phuson0206/petshop-frontend:1.0

    - name: Run PetShop with Docker Compose
      command: docker compose up -d
      args:
        chdir: /var/lib/jenkins/workspace/petshop-ci
