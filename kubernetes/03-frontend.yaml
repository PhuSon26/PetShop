apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: phuson0206/petshop-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5175
          readinessProbe:
            httpGet: {path: /, port: 5175}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - port: 5175
      targetPort: 5175
      nodePort: 30699  
